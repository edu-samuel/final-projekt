<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FridgeChef</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/result.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <nav>
          <ul>
            <li><a href="index.html">Hem</a></li>
            <li><a href="about.html">Om oss</a></li>
            <li><a href="contact.html">Kontakt</a></li>
          </ul>
        </nav>
        <a href="index.html" class="logo">🍳FridgeChef</a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-overlay">
          <h1>Hitta goda recept med ingredienser du har hemma!</h1>
          <div class="hero-card">
            <input
              type="text"
              id="ingredient-input"
              placeholder="Skriv in ingredienser du har hemma..."
            />

          <div class="filter-row">
            <button class="filter-btn type-btn active">Mat</button>
            <button class="filter-btn type-btn">Efterrätt</button>
          </div>

          <div class="filter-row">
            <button class="filter-btn region-btn">Europeisk</button>
            <button class="filter-btn region-btn">Asiatisk</button>
            <button class="filter-btn region-btn">Afrikansk</button>
          </div>

            <button class="search-btn">Sök recept ›</button>
          </div>
        </div>
      </section>
      <div id="resultat"></div>
    </main>
    <script src="../javascript/app.js"></script>
  </body>
<footer></footer>
</html>
