<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FridgeChef</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/contact.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <nav>
          <ul>
            <li><a href="index.html">Hem</a></li>
            <li><a href="about.html">Om oss</a></li>
            <li><a href="contact.html">Kontakt</a></li>
          </ul>
        </nav>
        <a href="index.html" class="logo">🍳 FridgeChef</a>
      </div>
    </header>

    <main>
      <section class="contact-hero">
        <div class="contact-overlay">
          <h1>Kontakta oss</h1>
          <p class="contact-desc">
            Har du problem eller frågor? Tveka inte att höra av dig till oss så
            hjälper vi dig så snart som möjligt!
          </p>

          <div class="contact-info">
            <div class="contact-item">
              <span>📞</span>
              <p>+46 70 123 45 67</p>
            </div>
            <div class="contact-item">
              <span>📧</span>
              <p>hej@fridgechef.se</p>
            </div>
          </div>
          <form id="contact-form">
            <input
              type="text"
              id="form-name"
              placeholder="Ditt namn"
              required
            />
            <input
              type="email"
              id="form-email"
              placeholder="Din e-post"
              required
            />
            <input type="text" id="form-subject" placeholder="Ämne" required />
            <textarea
              id="form-message"
              placeholder="Skriv ditt meddelande här..."
              rows="5"
              required
            ></textarea>
            <button type="submit">Skicka ›</button>
          </form>
        </div>
      </section>
    </main>
    <script src="../javascript/contact.js"></script>
  </body>
</html>
